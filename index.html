<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPアドレスを表示します</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #007BFF;
            padding-bottom: 10px;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .label {
            font-weight: bold;
            color: #666;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .value {
            font-size: 18px;
            color: #111;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #eee;
            word-break: break-all;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    
<div class="container">
    <h1>接続情報</h1>
    
    <div class="info-group">
        <span class="label">IPアドレス (IPv4/IPv6)</span>
        <div id="ip" class="value loading">読み込み中...</div>
    </div>
    
    <div class="info-group">
        <span class="label">国</span>
        <div id="country" class="value loading">読み込み中...</div>
    </div>

    <div class="info-group">
        <span class="label">都道府県</span>
        <div id="region" class="value loading">読み込み中...</div>
    </div>

    <div class="info-group">
        <span class="label">市区町村</span>
        <div id="city" class="value loading">読み込み中...</div>
    </div>
</div>

<script>
    // 無料のAPI（ipapi.co）を使ってIPと位置情報を取得
    fetch('https://ipapi.co/json/')
        .then(response => {
            if (!response.ok) {
                throw new Error('ネットワークエラーが発生しました。');
            }
            return response.json();
        })
        .then(data => {
            // 取得したデータをHTMLに反映
            document.getElementById('ip').textContent = data.ip || '取得失敗';
            document.getElementById('country').textContent = data.country_name || '取得失敗';
            document.getElementById('region').textContent = data.region || '取得失敗';
            document.getElementById('city').textContent = data.city || '取得失敗';
            
            // ローディングスタイルの解除
            document.querySelectorAll('.value').forEach(el => el.classList.remove('loading'));
        })
        .catch(error => {
            console.error('エラー:', error);
            document.querySelectorAll('.value').forEach(el => {
                el.textContent = 'エラーが発生しました';
                el.style.color = 'red';
            });
        });
</script>

</body>
</html>
